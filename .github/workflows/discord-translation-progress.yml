name: Discord translation progress

on:
  push:
    branches: [main]
    paths:
      - '**/*.po'
      - 'texturas/traducidas/**/*.dds'
      - 'texturas/progreso.json'
      - 'scripts/discord_translation_report.py'
      - 'tools/progress/build_progress_assets.py'
      - '.github/workflows/discord-translation-progress.yml'

permissions:
  contents: read

concurrency:
  group: discord-translation-progress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discord-report:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m pip install pillow
      - run: python tools/progress/build_progress_assets.py
      - name: Send Discord report
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_TRANSLATION_WEBHOOK }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: python scripts/discord_translation_report.py
