name: Rebuild progress assets

on:
  push:
    branches:
      - main
    paths:
      - "data/**/*.po"
      - "texturas/**/*.dds"
      - "texturas/progreso.json"
      - "assets/companion/substories.json"
      - "assets/companion/file_tags.json"
      - "assets/companion/hidden_lines.json"
      - "scripts/build_bot_progress.py"
      - "tools/progress/build_progress_assets.py"
      - ".github/workflows/rebuild-progress-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-progress-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild existing progress assets
        run: python tools/progress/build_progress_assets.py

      - name: Rebuild Discord bot progress
        run: python scripts/build_bot_progress.py

      - name: Commit generated progress
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md assets/progress assets/bot/progress.json

          if git diff --cached --quiet; then
            echo "No hay cambios de progreso."
            exit 0
          fi

          git commit -m "chore: actualizar progreso [skip ci]"
          git push
