name: Rebuild progress assets

on:
  push:
    branches: [main]
    paths:
      - 'data/**/*.po'
      - 'texturas/original/**/*.dds'
      - 'texturas/traducidas/**/*.dds'
      - 'texturas/progreso.json'
      - 'README.md'
      - '.github/workflows/rebuild-progress-assets.yml'
      - 'tools/progress/build_progress_assets.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild-progress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate progress assets
        run: python -u tools/progress/build_progress_assets.py
      - name: Update README progress section
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          readme_path = Path('README.md')
          progress = Path('assets/progress/readme_progress.md').read_text(encoding='utf-8').strip()
          readme = readme_path.read_text(encoding='utf-8')
          start, end = '<!-- PROGRESS_SECTION_START -->', '<!-- PROGRESS_SECTION_END -->'
          a, b = readme.find(start), readme.find(end)
          if a < 0 or b < a: raise SystemExit('No se encontraron los marcadores del README')
          readme_path.write_text(readme[:a] + f'{start}\n{progress}\n{end}' + readme[b+len(end):], encoding='utf-8')
          PY
      - name: Add texture badge to README
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('README.md'); text = path.read_text(encoding='utf-8')
          badge = '![Texturas](https://img.shields.io/endpoint?url=https://raw.githubusercontent.com/Kcat-art/DD-Y4-es419-translation/main/assets/progress/texture_badge.json)'
          review = '![Revisión](https://img.shields.io/endpoint?url=https://raw.githubusercontent.com/Kcat-art/DD-Y4-es419-translation/main/assets/progress/review_badge.json)'
          if badge not in text: text = text.replace(review, review + '\n' + badge)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit generated assets
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/progress README.md
          git diff --cached --quiet && exit 0
          git commit -m 'Update progress assets'
          git push
